<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestell-App</title>
    <link rel="stylesheet" href="./style/style.css" />
    <link
      rel="shortcut icon"
      href="./assets/icons/favicon.png"
      type="image/x-icon"
    />

  <body onload="init()">
    <header>
      <div class="container subcontainer header__container">
        <img
          src="./assets/img/Logo 02.png"
          alt="Bestellapp logo"
          class="logo"
        />
        <img class="header__nav" src="./assets/icons/dehaze.svg" alt="" />
      </div>
    </header>

    <main>
      <section class="hero__section">
        <div class="hero__img">
          <img
            class="hero__companylogo"
            src="./assets/img/logo-burgerhouse.png"
            alt="company logo"
          />
        </div>

        <div class="restaurant">
          <div class="restaurant__name-rating">
            <h1 class="restaurant__name">
              <span class="restaurant__name--highlight">Burger</span>House
            </h1>
            <div class="restaurant__rating">
              <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M15 22.5L6.18034 27L8.09017 17.5L0 10H10L15 0L20 10H30L21.9098 17.5L23.8197 27L15 22.5Z"
                />
              </svg>
              <span>4.9</span><span style="font-weight: 200">(615)</span>
            </div>
          </div>

          <p class="restaurant__description">
            The best of Burgers, Pizza, and Greens, all in one great place.
          </p>
        </div>
      </section>
      <div class="maincontentwrapper container">
        <section id="products" class="products">
          <!-- Dynamically filled with JavaScript -->
        </section>
        <div class="basket-wrapper">
          <aside class="basket">
            <h2 class="basket__title">Your Basket</h2>

              <p>
                Nothing here yet.<br />
                Go ahead and choose something delicious!

            </div>

              Buy now (<span id="btn-total"></span>)

          </aside>
        </div>
      </div>
